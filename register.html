<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- bootstrap css -->
     <link rel="stylesheet" href="./css/bootstrap.min.css">
    <!-- style css -->
     <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="container mt-12 pt-5">
        <div class="row">
            <div class="md:col-6">
                <img src="./image/neck2.jpeg" class="w-75 rounded-5" >
            </div>
            <div class="md:col-6 d-flex flex-column justify-content-center">
                <h2>Create Account</h2>
                <p class="my-5">Go ahead and sign up, let everyone <br>know how awesome you are!</p>
                <h5 id="result"></h5>

                <form onsubmit="return validateData()" action="success.html" method="post">
                    <input id="user" type="text" placeholder="User Name" name="username" class="form-control mb-10 p-3 d-block ">
                    <input id="email" type="text" placeholder="Email" name="email" class="form-control mb-10 p-3 d-block">
                    <input id="password" type="password" placeholder="Password" name="password" class="form-control mb-10 p-3 d-block">
                    <input id="confirm" type="password" placeholder="Confirm Password" name="confirm password" class="form-control mb-10 p-3 d-block">
                    <input type="submit" class="btn-outline theme-primary form-control">
                </form>
            </div>
        </div>
    </div>
    


    <!-- bootstrap bundle -->
    <script src="./js/bootstrap.bundle.min.js"></script>
    <!-- main js -->
    <script src="./js/main.js"></script>
</body>
</html>
